 });

    const viewChanged=beforeView!==afterView;
    theme();
    try{localStorage.setItem('coinpie',JSON.stringify(S))}catch(e){throw new Error('Could not save the synced data on this device')}
    if(mergedText!==remoteText)await writeBackup(S,file);
    if(viewChanged&&V.n!=='acc')render();
   }else{await writeBackup(S,file)}
  }else{await writeBackup(S,null)}
  SY.status='on';SY.error='';SY.last=Date.now();saveOAuthSession();
 }catch(e){SY.status='err';SY.error=e.message||'Sync failed';console.error('CoinPie Drive sync:',e)}
 finally{SY.busy=false}
}
function queueSync(){if(!SY.token||Date.now()>=SY.expires)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncDrive(false),1000)}
function startPolling(){
 clearInterval(pollTimer);
 pollTimer=setInterval(()=>{
  if(!SY.token){return}
  if(Date.now()>=SY.expires){SY.token=null;SY.expires=0;saveOAuthSession();SY.status='expired';SY.error='Google session expired. Reconnect to resume syncing.';render();clearInterval(pollTimer);return}
  if(SY.expires-Date.now()<180000&&!SY.refreshing){SY.refreshing=true;connectGoogle(true);return}
  syncDrive(false)
 },20000)
}
function disconnectGoogle(){SY.token=null;SY.expires=0;SY.status='off';SY.fileId=null;SY.refreshing=false;saveOAuthSession();clearInterval(pollTimer);render();toast('Google disconnected. Local data is unchanged')}
function exportBackup(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='coinpie-backup.json';a.click();URL.revokeObjectURL(url);toast('Backup downloaded')}
function restoreBackup(){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=()=>{const file=f.files&&f.files[0];if(!file)return;file.text().then(raw=>{try{const x=JSON.parse(raw);if(!Array.isArray(x.tx)||!Array.isArray(x.cats))throw new Error('Invalid backup file');S={...defaultState(),...x};S.date=ymd(new Date());theme();persist();V={n:'home'};render();toast('Backup restored')}catch(e){toast('Could not restore: invalid backup')}})};f.click()}

document.addEventListener('click',e=>{const t=e.target.closest('button,[data-tx],[data-cd]')||e.target;const action=t.closest('[data-a]'),A=action&&action.dataset.a;
if(t.dataset.x==='1'){shut();return}if(t.dataset.x==='2'){$('#dg').innerHTML='';return}
if(t.closest('[data-undo]')&&lastDeleted){S.tx.push({...lastDeleted,updatedAt:Date.now()});S._deletedTx=(S._deletedTx||[]).filter(z=>z.id!==lastDeleted.id);lastDeleted=null;persist();render();$('#tg').innerHTML='';return}
const tx=t.closest('[data-tx]');if(tx&&!swiped){const x=S.tx.find(y=>y.id===tx.dataset.tx);if(x)entry(x.t,x);return}
const cd=t.closest('[data-cd]');if(cd){V={n:'detail',c:cd.dataset.cd,from:V.n==='stats'?'stats':'home',m:V.n==='stats'?V.m:S.date.slice(0,7)};render();return}
const st=t.closest('[data-st]');if(st){V.t=st.dataset.st;render();return}const sm=t.closest('[data-sm]');if(sm){V.m=sm.dataset.sm;render();return}
const del=t.closest('[data-dc]');if(del){const id=del.dataset.dc;if(S.tx.some(x=>x.c===id)){toast('This category has entries. Existing entries will remain.')}S.cats=S.cats.filter(c=>c.id!==id);S._deletedCats=Array.isArray(S._deletedCats)?S._deletedCats:[];S._deletedCats.push({id,at:Date.now()});persist();render();return}
const nc=t.closest('[data-nc]');if(nc){catDlg(nc.dataset.nc,()=>render());return}
if(!A)return;
if(A==='menu')V={n:'menu'};else if(A==='home')V={n:'home'};else if(A==='prev'){step(-1);return}else if(A==='next'){step(1);return}else if(A==='pick'){pick();return}else if(A==='ae'){entry('e');return}else if(A==='ai'){entry('i');return}
else if(A==='cats')V={n:'cats'};else if(A==='stats')V={n:'stats',m:S.date.slice(0,7),t:'e'};else if(A==='acc')V={n:'acc'};
else if(A==='sp'||A==='sn'){const d=pd(V.m+'-01');d.setMonth(d.getMonth()+(A==='sp'?-1:1));V.m=ymd(d).slice(0,7)}
else if(A==='cur'){options('Currency',[['৳','Taka ৳'],['$','Dollar $'],['€','Euro €'],['£','Pound £'],['₹','Rupee ₹']],S.cur,v=>S.cur=v);return}
else if(A==='thm'){options('Appearance',[['system','System preference'],['light','Light'],['dark','Dark']],S.theme,v=>{S.theme=v;theme()});return}
else if(A==='bak'){exportBackup();return}else if(A==='res'){restoreBackup();return}
else if(A==='login'){connectGoogle();return}else if(A==='sync'){syncDrive(false).then(()=>{if(V.n==='acc')render();if(SY.status==='on')toast('Drive is up to date');else toast(SY.error||'Sync failed')});return}else if(A==='logout'){disconnectGoogle();return}
render()});
document.addEventListener('touchstart',e=>{swipeStart=e.touches[0].clientX;swiped=false},{passive:true});document.addEventListener('touchend',e=>{const row=e.target.closest('[data-tx]');if(row&&swipeStart-e.changedTouches[0].clientX>90){swiped=true;removeEntry(row.dataset.tx);setTimeout(()=>swiped=false,350)}},{passive:true});
window.addEventListener('online',()=>{if(SY.token&&SY.expires>Date.now())syncDrive(false)});
theme();render();
if(SY.token&&SY.expires>Date.now()){SY.status='on';startPolling();setTimeout(()=>syncDrive(false),700)}
</script>
